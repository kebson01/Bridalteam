# Docker Compose for Google Compute Engine (GCE) with Cloud SQL Auth Proxy
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env.gcp
    depends_on:
      - cloudsql
    volumes:
      - ./website:/var/www/html/website
      - ./admin:/var/www/html/admin
      - ./blog:/var/www/html/blog

  cloudsql:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.1
    restart: unless-stopped
    command: [
      "--credentials-file=/secrets/key.json",
      "--address=0.0.0.0",
      "--port=3306",
      "${CLOUD_SQL_CONNECTION_NAME}"
    ]
    env_file:
      - .env.gcp
    networks:
      - default
    expose:
      - "3306"
    volumes:
      - ./gcp/key.json:/secrets/key.json:ro

networks:
  default:
    name: bridalteam-gce


