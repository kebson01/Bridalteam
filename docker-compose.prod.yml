version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: bridalteam-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ALLOW_ORIGIN=${APP_URL}
      - SEO_SITETITLE=Bridal Team - Wedding Planning Made Simple
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - bridalteam-network

  db:
    image: mysql:8.0
    container_name: bridalteam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bridalteam-network

  redis:
    image: redis:7-alpine
    container_name: bridalteam-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - bridalteam-network

  nginx:
    image: nginx:alpine
    container_name: bridalteam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - app
    networks:
      - bridalteam-network

volumes:
  mysql_data:
  redis_data:

networks:
  bridalteam-network:
    driver: bridge
