name: Inspiration people check

# Once a day: asks whether each Inspiration feed photo not yet checked shows
# people, so people-free photos can rotate onto the homepage mosaic.
# The work happens in app/api/cron/people-check (lib/people-check.ts).
#
# Needs the CRON_SECRET repository secret, set to the same value as the
# app's CRON_SECRET environment variable (32+ random characters), and the
# app's ANTHROPIC_API_KEY. Optional SITE_URL repository variable (default
# https://bridalteam.com).

on:
  schedule:
    - cron: "43 11 * * *" # 11:43 UTC daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: people-check
  cancel-in-progress: false

jobs:
  run:
    name: Check new Inspiration photos for people
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Like site-retention.yml: without the secret this finishes green with a
      # notice, rather than a red X every day before it's configured.
      - name: Call the people-check endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://bridalteam.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set; skipping the people check."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/people-check"
