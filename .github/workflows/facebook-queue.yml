name: Facebook queue

# Posts whatever is due in marketing/facebook/queue/ to the Bridal Team
# Facebook Page, then commits the moves to marketing/facebook/posted/ so the
# same post never goes out twice. Format and one-time Meta setup:
# marketing/facebook/queue/README.md.
#
# Needs two repository secrets: FB_PAGE_ID and FB_PAGE_TOKEN.
#
# Scheduled workflows only run from the default branch, so nothing posts until
# this file is on main.

on:
  schedule:
    # Four times a day (UTC): about 8am, 11am, 4pm and 8pm Eastern. A post goes
    # out on the first run after its publish_at, and GitHub can start scheduled
    # runs a few minutes late. Minute 20, not 0: the top of the hour is when
    # GitHub's scheduler is busiest and most delayed.
    - cron: '20 0,12,15,20 * * *'
  # "Run workflow" button in the Actions tab, to post right away or to check
  # the queue without posting.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the queue without posting anything
        type: boolean
        default: false

# Two runs at once could both see a post as due and publish it twice.
concurrency:
  group: facebook-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`: the script uses only Node built-ins.
      - name: Publish due posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/facebook-publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when one post failed, so the ones that did go out are
      # recorded and not posted again on the next run.
      - name: Record posted posts
        if: always() && !inputs.dry_run
        run: |
          git add -A marketing/facebook
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Facebook posts published from the queue"
          git pull --rebase
          git push
