# Docker Compose for Bridalteam
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    volumes:
      - ./website:/var/www/html/website
      # Preserve the vendor/ dir installed during image build (host has none,
      # so without this the bind mount above would hide it and break the app).
      - /var/www/html/website/vendor
      - ./admin:/var/www/html/admin
      - ./blog:/var/www/html/blog
    environment:
      # Injected into the container; entrypoint uses this so tokens survive restarts.
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_change_me_0123456789abcdef}
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bridalteam
      MYSQL_USER: bridalteam_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
